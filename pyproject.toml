[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "bookledger-local"
version = "2.5.0"
description = "Offline-capable, metadata-only personal ebook catalog and reading tracker"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "typer>=0.12,<1", "pymupdf>=1.24,<2", "python-multipart>=0.0.9", "Pillow>=10,<13"]
[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
[project.scripts]
bookledger = "bookledger.cli:app"
[tool.setuptools.packages.find]
include = ["bookledger*"]

[tool.setuptools.package-data]
bookledger = ["*.css", "*.svg", "frontend_dist/*", "frontend_dist/assets/*"]
